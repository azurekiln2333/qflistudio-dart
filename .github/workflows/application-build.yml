name: Android Windows Linux applications

on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - .github/workflows/application-build.yml
      - tool/**
      - lib/**
      - vendor/**
      - assets/**
      - curriculum/**
      - test/**
      - analysis_options.yaml
      - pubspec.*
      - android/**
      - windows/**
      - linux/**
      - native/dart-sdk/**

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: windows-x64, platform: windows, arch: x64, runner: windows-2022}
          - {name: linux-x64, platform: linux, arch: x64, runner: ubuntu-24.04}
          - {name: android-arm64-v8a, platform: android, arch: arm64, abi: arm64-v8a, runner: ubuntu-24.04}
          - {name: android-x86_64, platform: android, arch: x64, abi: x86_64, runner: ubuntu-24.04}
    defaults:
      run:
        shell: bash
        working-directory: qfli_dart
    env:
      CI_PLATFORM: ${{ matrix.platform }}
      CI_ARCH: ${{ matrix.arch }}
      CI_NAME: ${{ matrix.name }}
      CI_ABI: ${{ matrix.abi }}
    steps:
      - name: Enable long Git paths for preserved dependency history
        if: matrix.platform == 'windows'
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qfli_dart
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: azurekiln2333/qflistudio-core
          ref: 8e031313ffc8d531c5a6b4d131f721f35da04c86
          path: qflistudio-core
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: flutter/flutter
          ref: 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694 # 3.41.9
          path: flutter
          persist-credentials: false
      - name: Bootstrap the pinned Flutter toolchain
        run: |
          git -C ../flutter tag 3.41.9 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694
          echo "$GITHUB_WORKSPACE/flutter/bin" >> "$GITHUB_PATH"
          ../flutter/bin/flutter --version
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libstdc++-12-dev
      - name: Verify and package the desktop native SDK
        if: matrix.platform != 'android'
        run: python tool/ci/package_desktop_sdk.py --sdk ../flutter/bin/cache/dart-sdk --platform "$CI_PLATFORM" --arch "$CI_ARCH" --output dist/native
      - name: Upload the desktop native SDK
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.name }}
          path: qfli_dart/dist/native/
          if-no-files-found: error
          retention-days: 30
      - name: Prepare the pinned core for standard Flutter
        run: python ../qflistudio-core/tool/ci/prepare_flutter_core.py --core-root ../qflistudio-core --sdk-root ../flutter --sdk-revision 00b0c91f06209d9e4a41f71b7a512d6eb3b9c694 --flavor official --app-root .
      - name: Resolve app dependencies
        run: flutter pub get
      - name: Validate the Android native SDK
        if: matrix.platform == 'android'
        run: |
          bash native/dart-sdk/android/prepare_sdk.sh "$CI_ABI" "$RUNNER_TEMP/android-input"
          mkdir -p "$RUNNER_TEMP/android-sdk"
          tar -xf "$RUNNER_TEMP/android-input/sdk.tar" -C "$RUNNER_TEMP/android-sdk"
          pwsh -File native/dart-sdk/android/stage.ps1 -Abi "$CI_ABI" -Sdk "$RUNNER_TEMP/android-sdk"
      - name: Verify generated curriculum assets
        if: matrix.platform == 'linux'
        run: |
          dart run tool/build_dart_content.dart
          git diff --exit-code -- assets/content/dart_tutorials.json assets/content/dart_examples.json
      - name: Audit curriculum compatibility and portable execution
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist/host-checks
          dart run tool/verify_dart_content.dart
          dart run tool/audit_compat.dart | tee dist/host-checks/compat-audit.txt
          grep -Fx 'unlabeled: 0 []' dist/host-checks/compat-audit.txt
          dart run tool/verify_portable_content.dart --report dist/host-checks/portable-report.json
      - name: Check the native offline channel on the host
        if: matrix.platform == 'linux'
        run: |
          npm install --prefix "$RUNNER_TEMP/qfli-node-gate" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript@5.9.3
          QFLI_TYPESCRIPT="$RUNNER_TEMP/qfli-node-gate/node_modules/typescript" \
            node --max-old-space-size=128 --test test/native_entry_ability_test.cjs
      - name: Analyze application and run host tests
        if: matrix.platform == 'linux'
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build application
        id: build
        run: |
          if [[ "$CI_PLATFORM" == android ]]; then
            flutter build apk --release --no-pub --target-platform "android-$CI_ARCH"
          else
            flutter build "$CI_PLATFORM" --release --no-pub
          fi
      - name: Archive application and build evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile
          import zipfile

          name = os.environ['CI_NAME']
          platform = os.environ['CI_PLATFORM']
          output = Path('dist/app')
          output.mkdir(parents=True, exist_ok=True)
          if platform == 'android':
              source = Path('build/app/outputs/flutter-apk/app-release.apk')
              target = output / f'qfli-dart-{name}-test-signed.apk'
              shutil.copy2(source, target)
              with zipfile.ZipFile(target) as package:
                  names = package.namelist()
                  abi = os.environ['CI_ABI']
                  actual_abis = {n.split('/')[1] for n in names if n.startswith('lib/')}
                  assert actual_abis == {abi}, f'Unexpected APK ABIs: {actual_abis}'
                  for lib in ['libflutter.so', 'libapp.so', 'libqfli_dartvm.so']:
                      assert f'lib/{abi}/{lib}' in names, f'Missing {lib}'
          elif platform == 'windows':
              source = Path('build/windows/x64/runner/Release')
              assert (source / 'data/dart-sdk/bin/dart.exe').is_file()
              target = output / f'qfli-dart-{name}.zip'
              with zipfile.ZipFile(target, 'w', compression=zipfile.ZIP_DEFLATED) as package:
                  for path in sorted(source.rglob('*')):
                      if path.is_file(): package.write(path, name + '/' + path.relative_to(source).as_posix())
          else:
              source = Path('build/linux/x64/release/bundle')
              assert (source / 'data/dart-sdk/bin/dart').is_file()
              target = output / f'qfli-dart-{name}.tar.gz'
              with tarfile.open(target, 'w:gz') as package:
                  package.add(source, arcname=name)
          with target.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          (output / 'SHA256SUMS').write_text(f'{digest}  {target.name}\n')
          evidence = {'commit': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                      'coreCommit': '8e031313ffc8d531c5a6b4d131f721f35da04c86',
                      'flutterCommit': '00b0c91f06209d9e4a41f71b7a512d6eb3b9c694',
                      'platform': platform, 'architecture': os.environ['CI_ARCH'],
                      'signing': 'ephemeral debug key' if platform == 'android' else 'unsigned',
                      'uiRuntimeVerified': False}
          (output / 'provenance.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
      - name: Upload application
        id: app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.name }}
          path: qfli_dart/dist/app/
          if-no-files-found: error
          retention-days: 30
      - name: Build and verify the installer package
        if: matrix.platform != 'android'
        run: python tool/ci/package_installer.py "$CI_PLATFORM" --name "$CI_NAME" --output dist/installer
      - name: Upload the installer package
        id: installer
        if: matrix.platform != 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-${{ matrix.name }}
          path: qfli_dart/dist/installer/
          if-no-files-found: error
          retention-days: 30
      - name: Archive native and Flutter intermediates
        id: intermediates
        if: ${{ always() && !cancelled() }}
        env:
          JOB_STATUS: ${{ job.status }}
          BUILD_STATUS: ${{ steps.build.outcome }}
        run: python tool/ci/archive_intermediates.py --name "intermediates-$CI_NAME" --output dist/intermediates --job-status "$JOB_STATUS" --build-status "$BUILD_STATUS"
      - name: Upload intermediate archive
        if: ${{ always() && steps.intermediates.outputs.created == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intermediates-${{ matrix.name }}
          path: qfli_dart/dist/intermediates/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Upload Linux host gate diagnostics
        if: ${{ always() && matrix.platform == 'linux' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-checks-${{ matrix.name }}
          path: qfli_dart/dist/host-checks/
          if-no-files-found: warn
          retention-days: 3
      - name: Write download summary
        if: ${{ !cancelled() }}
        env:
          ARTIFACT_URL: ${{ steps.app.outputs.artifact-url }}
          INSTALLER_URL: ${{ steps.installer.outputs.artifact-url }}
        run: |
          {
            printf '### %s\n\n' "$CI_NAME"
            if [ -n "$ARTIFACT_URL" ]; then printf '[Download application](%s)\n\n' "$ARTIFACT_URL"; fi
            if [ -n "$INSTALLER_URL" ]; then printf '[Download installer package](%s)\n\n' "$INSTALLER_URL"; fi
            printf 'Artifacts are retained for 30 days. See provenance.json for signing and validation scope.\n'
          } >> "$GITHUB_STEP_SUMMARY"
