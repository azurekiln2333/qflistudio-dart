name: Archive native SDK inputs

on:
  workflow_dispatch:
  push:
    branches: [ci/native-android-sdk]
    paths: [.github/workflows/archive-native-inputs.yml]

permissions:
  contents: read

concurrency:
  group: archive-native-inputs
  cancel-in-progress: false

jobs:
  archive:
    name: Preserve ${{ matrix.abi }} package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download and verify the original Termux package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ABI: ${{ matrix.abi }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          import tarfile
          import zipfile

          lock = json.loads(pathlib.Path('native/dart-sdk/android/packages.lock.json').read_text())
          package = lock['packages'][os.environ['ABI']]
          source = lock['archiveProvenance']
          artifact_id = package['sourceArtifactId']
          artifact_path = f"repos/{source['repository']}/actions/artifacts/{artifact_id}"
          metadata = json.loads(subprocess.check_output(['gh', 'api', artifact_path]))
          assert not metadata['expired'], 'Upstream artifact expired'
          assert metadata['workflow_run']['id'] == source['runId'], 'Wrong upstream run'
          assert metadata['workflow_run']['head_sha'] == source['commit'], 'Wrong upstream commit'
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'upstream.zip'
          with archive.open('wb') as target:
              subprocess.run(['gh', 'api', artifact_path + '/zip'], stdout=target, check=True)
          filename = pathlib.PurePosixPath(package['filename']).name
          with zipfile.ZipFile(archive) as zipped:
              # Termux uploads a tar of debs inside the Actions artifact ZIP.
              with zipped.open(metadata['name'] + '.tar') as tar_stream:
                  with tarfile.open(fileobj=tar_stream, mode='r|') as tar:
                      matches = []
                      for member in tar:
                          if member.name == 'debs/' + filename and member.isfile():
                              matches.append(tar.extractfile(member).read())
                      assert len(matches) == 1, 'Expected exactly one source package'
                      data = matches[0]
          digest = hashlib.sha256(data).hexdigest()
          assert len(data) == package['size'], 'Source package size differs from lock'
          assert digest == package['sha256'], 'Source package SHA256 differs from lock'
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / filename
          output.write_bytes(data)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PACKAGE_PATH={output}\n')
              env.write(f'RELEASE_TAG=native-sdk-inputs-{lock["sdkVersion"]}\n')
          print(f'Verified {filename}: {len(data)} bytes, SHA256 {digest}')
          PY
      - name: Archive verified package in the input release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          package = Path(os.environ['PACKAGE_PATH'])
          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['RELEASE_TAG']
          release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
          assets = [a for a in release['assets'] if a['name'] == package.name]
          if assets:
              digest = 'sha256:' + hashlib.sha256(package.read_bytes()).hexdigest()
              assert len(assets) == 1 and assets[0]['digest'] == digest, 'Existing asset has different bytes'
              assert assets[0]['size'] == package.stat().st_size, 'Existing asset has different size'
              print('Identical verified input is already archived')
          else:
              subprocess.run(['gh', 'release', 'upload', tag, str(package), '--repo', repo], check=True)
          PY
          printf 'Archived verified package: `%s`\n' "$(basename "$PACKAGE_PATH")" >> "$GITHUB_STEP_SUMMARY"
